services:
  mongo:
    image: mongo:7
    network_mode: host
    environment:
      MONGO_INITDB_DATABASE: studentdb
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./mern-demo
      dockerfile: ./server/Dockerfile
    network_mode: host
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/studentdb
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data: